syntax = "proto3";
package schemastore;
option go_package = "github.com/pingcap/ticdc/pkg/schemastore";

import "gogoproto/gogo.proto";
import "eventpb/event.proto";

message KeyspaceMeta {
    uint32 id = 1 [(gogoproto.customname) = "ID"];
    string name = 2;
}

message Error {
    string message = 1;
    string code = 2;
}

message TableInfoResult {
    int64 table_id = 1 [(gogoproto.customname) = "TableID"];
    // The existing common.TableInfo encoding, present when error is empty.
    bytes table_info = 2;
    string error = 3;
}

message SchemaTableName {
    string schema_name = 1;
    string table_name = 2;
}

message PhysicalTable {
    int64 schema_id = 1 [(gogoproto.customname) = "SchemaID"];
    int64 table_id = 2 [(gogoproto.customname) = "TableID"];
    bool splitable = 3;
    SchemaTableName schema_table_name = 4;
}

message GetTableInfosRequest {
    uint64 request_id = 1 [(gogoproto.customname) = "RequestID"];
    KeyspaceMeta keyspace = 2 [(gogoproto.nullable) = false];
    repeated int64 table_ids = 3 [(gogoproto.customname) = "TableIDs"];
    uint64 ts = 4;
}

message GetTableInfosResponse {
    uint64 request_id = 1 [(gogoproto.customname) = "RequestID"];
    // Results cover a prefix of the requested table_ids, in the same order.
    repeated TableInfoResult table_infos = 2 [(gogoproto.nullable) = false];
    // The client must issue a new request for the remaining table_ids.
    bool more = 3;
    Error error = 4;
}

message GetAllPhysicalTablesRequest {
    uint64 request_id = 1 [(gogoproto.customname) = "RequestID"];
    KeyspaceMeta keyspace = 2 [(gogoproto.nullable) = false];
    uint64 ts = 3;
    eventpb.InnerFilterConfig filter = 4;
    bool case_sensitive = 5;
    bool force_replicate = 6;
}

message GetAllPhysicalTablesResponse {
    uint64 request_id = 1 [(gogoproto.customname) = "RequestID"];
    repeated PhysicalTable tables = 2 [(gogoproto.nullable) = false];
    Error error = 3;
}
