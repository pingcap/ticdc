# The target schema follows the source schema. `allow_same_cluster_src2_routed` is not replicated by
# the filter, so the changefeed cannot capture its own writes and must be accepted.
allow-same-cluster = true

[filter]
rules = ['allow_same_cluster_src2.*']

[sink]
[[sink.dispatchers]]
matcher = ['allow_same_cluster_src2.*']
target-schema = '{schema}_routed'
target-table = '{table}_routed'
