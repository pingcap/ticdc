allow-same-cluster = true
case-sensitive = false

[filter]
rules = ['allow_same_cluster_src.t1', 'allow_same_cluster_src_copy.t2']

[[sink.dispatchers]]
matcher = ['allow_same_cluster_src.t1']
target-schema = '{schema}_COPY'
target-table = 't1_copy'

[[sink.dispatchers]]
matcher = ['allow_same_cluster_src_copy.t2']
target-schema = 'allow_same_cluster_third'
target-table = 't2_copy'
