# This changefeed writes to the upstream cluster itself, which is only allowed because
# `allow-same-cluster` is set. The sink writes into `allow_same_cluster.t2`, which is not
# matched by the filter, so the changefeed cannot capture its own writes.
allow-same-cluster = true

[filter]
rules = ['allow_same_cluster.t1']

[sink]
[[sink.dispatchers]]
matcher = ['allow_same_cluster.t1']
target-schema = 'allow_same_cluster'
target-table = 't2'
