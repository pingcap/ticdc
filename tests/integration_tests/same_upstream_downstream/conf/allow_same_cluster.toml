# This changefeed writes to the upstream cluster itself, which is only allowed because
# `allow-same-cluster` is set.
#
# The matcher covers the whole filter rule and maps every matched table to `allow_same_cluster_dst`,
# which the filter never replicates, so the changefeed cannot capture its own writes.
allow-same-cluster = true
case-sensitive = false

[filter]
# Rule padding must be ignored; target names must be compared case insensitively.
rules = [" \tallow_same_cluster_src.*\t "]

[sink]
[[sink.dispatchers]]
matcher = ["\tallow_same_cluster_src.* "]
target-schema = 'ALLOW_SAME_CLUSTER_DST'
target-table = '{table}_ROUTED'
