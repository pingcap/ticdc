allow-same-cluster = true
case-sensitive = false

# Rule padding must not hide a target database inside the source range.
[filter]
rules = [" \tallow_same_cluster_src.t1\t "]

[[sink.dispatchers]]
matcher = [" \tallow_same_cluster_src.t1\t "]
target-schema = 'ALLOW_SAME_CLUSTER_SRC'
target-table = 'T1_COPY'
