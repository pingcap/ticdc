# Negated filter rules are not supported together with `allow-same-cluster`, so this configuration
# must be rejected instead of being approximated.
allow-same-cluster = true

[filter]
rules = ['allow_same_cluster_src.*', '!allow_same_cluster_src.t1']

[sink]
[[sink.dispatchers]]
matcher = ['allow_same_cluster_src.*']
target-schema = 'allow_same_cluster_dst'
