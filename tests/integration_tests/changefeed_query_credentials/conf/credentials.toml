[consistent]
level = "none"
storage = "s3://bucket/redo?secret-access-key=redo-credential-sentinel"

[sink.kafka-config]
sasl-user = "visible-user"
sasl-password = "sasl-credential-sentinel"
sasl-gssapi-password = "gssapi-credential-sentinel"
sasl-oauth-client-id = "visible-client"
sasl-oauth-client-secret = "oauth-credential-sentinel"
sasl-oauth-token-url = "https://oauth.example/token?client_secret=token-url-credential-sentinel"
key = "key-credential-sentinel"

[sink.kafka-config.large-message-handle]
large-message-handle-option = "none"
claim-check-storage-uri = "s3://bucket/claim?access-key=claim-credential-sentinel"

[sink.kafka-config.glue-schema-registry-config]
registry-name = "visible-registry"
region = "us-east-1"
access-key = "glue-access-credential-sentinel"
secret-access-key = "glue-secret-credential-sentinel"
token = "glue-token-credential-sentinel"

[sink.pulsar-config]
authentication-token = "pulsar-token-credential-sentinel"
basic-user-name = "visible-pulsar-user"
basic-password = "pulsar-password-credential-sentinel"
tls-key-file-path = "visible-pulsar-key"
tls-certificate-file = "visible-pulsar-cert"

[sink.pulsar-config.oauth2]
oauth2-client-id = "visible-pulsar-client"
oauth2-audience = "visible-pulsar-audience"
oauth2-private-key = "pulsar-oauth-key-credential-sentinel"
oauth2-issuer-url = "https://user:pulsar-issuer-credential-sentinel@oauth.example"
