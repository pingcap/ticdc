[filter]
rules = ["event_filter.*", "filter.t1", "filter.sql_*"] # replicate all tables in the event_filter database
# This event filter rules will apply to table t1 only.
[[filter.event-filters]]
matcher = ["event_filter.t1"]
ignore-event = ["drop table", "delete"]
ignore-insert-value-expr = "id = 2 or city = 'tokyo'"

# Filter rules for virtual column table
[[filter.event-filters]]
matcher = ["event_filter.t_virtual"]
ignore-insert-value-expr = "id = 2 or category = 'furniture' or is_discounted = true"

[[filter.event-filters]]
matcher = ["event_filter.t_truncate"]
ignore-event = ["truncate table"]

[[filter.event-filters]]
matcher = ["event_filter.t_alter"]
ignore-event = ["alter table"]

[[filter.event-filters]]
matcher = ["event_filter.t_name*"]
ignore-event = ["rename table"]

[[filter.event-filters]]
matcher = ["event_filter.t_create"]
ignore-event = ["create table"]

[[filter.event-filters]]
matcher = ["event_filter.t_rename4"]
ignore-event = ["rename table"]

# The event filter of t_fk_child is what triggers
# https://github.com/pingcap/ticdc/issues/6275 , and the test data has no delete
# on that table, so the filter does not change what is replicated.
[[filter.event-filters]]
matcher = ["event_filter.t_fk_child"]
ignore-event = ["delete"]

# Match ordinary DDLs before identifier, keyword, and whitespace normalization.
# https://github.com/pingcap/ticdc/issues/6774
[[filter.event-filters]]
matcher = ["event_filter.t_ignore_sql_original"]
ignore-sql = ["^ALTER TABLE t_ignore_sql_original ADD COLUMN"]

[[filter.event-filters]]
matcher = ["event_filter.t_ignore_sql_quoted"]
ignore-sql = ["^ALTER TABLE `t_ignore_sql_quoted` ADD COLUMN"]

[[filter.event-filters]]
matcher = ["event_filter.t_ignore_sql_keyword"]
ignore-sql = ["add column"]

[[filter.event-filters]]
matcher = ["event_filter.t_ignore_sql_whitespace"]
ignore-sql = ["^ALTER TABLE"]

# Single-table renames use the original query, including its SQL spelling.
[[filter.event-filters]]
matcher = ["event_filter.sql_rename_raw"]
ignore-sql = ['^RENAME TABLE sql_rename_raw TO sql_rename_raw_done$']

[[filter.event-filters]]
matcher = ["event_filter.sql_rename_restored"]
ignore-sql = ['^RENAME TABLE `event_filter`\.`sql_rename_restored` TO `event_filter`\.`sql_rename_restored_done`$']

[[filter.event-filters]]
matcher = ["event_filter.sql_alter_rename_raw"]
ignore-sql = ['^ALTER TABLE sql_alter_rename_raw RENAME TO sql_alter_rename_raw_done$']

[[filter.event-filters]]
matcher = ["event_filter.sql_alter_rename_restored"]
ignore-sql = ['^RENAME TABLE `event_filter`\.`sql_alter_rename_restored` TO ']

[[filter.event-filters]]
matcher = ["event_filter.sql_view_rename_raw"]
ignore-sql = ['^RENAME TABLE sql_view_rename_raw TO sql_view_rename_raw_done$']

[[filter.event-filters]]
matcher = ["event_filter.sql_view_rename_restored"]
ignore-sql = ['^RENAME TABLE `event_filter`\.`sql_view_rename_restored` TO `event_filter`\.`sql_view_rename_restored_done`$']

# These special DDLs use rebuilt SQL before ignore-sql matching.
[[filter.event-filters]]
matcher = ["event_filter.sql_multi_*"]
ignore-sql = ['^RENAME TABLE `event_filter`\.`sql_multi_ignored` TO `event_filter`\.`sql_multi_ignored_done`$']

[[filter.event-filters]]
matcher = ["event_filter.sql_drop_ignored", "event_filter.sql_drop_kept"]
ignore-sql = ['^DROP TABLE `event_filter`\.`sql_drop_ignored`$']

[[filter.event-filters]]
matcher = ["event_filter.sql_drop_view_*"]
ignore-sql = ['^DROP VIEW `event_filter`\.`sql_drop_view_ignored`$']

[[filter.event-filters]]
matcher = ["event_filter.sql_exchange_ignored"]
ignore-sql = ['^ALTER TABLE `event_filter`\.`sql_exchange_ignored` .* WITHOUT VALIDATION$']

[[filter.event-filters]]
matcher = ["event_filter.sql_exchange_kept"]
ignore-sql = ['^ALTER TABLE sql_exchange_kept EXCHANGE PARTITION p0 WITH TABLE sql_exchange_kept_normal WITHOUT VALIDATION$']

# CREATE LIKE and CREATE VIEW use the original SQL before qualifying references.
[[filter.event-filters]]
matcher = ["filter.sql_like_ignored"]
ignore-sql = ['^CREATE TABLE filter\.sql_like_ignored LIKE sql_like_source$']

[[filter.event-filters]]
matcher = ["filter.sql_like_kept"]
ignore-sql = ['^CREATE TABLE `filter`\.`sql_like_kept` LIKE `event_filter`\.`sql_like_source`$']

[[filter.event-filters]]
matcher = ["filter.sql_view_ignored"]
ignore-sql = ['^CREATE VIEW filter\.sql_view_ignored AS SELECT id FROM sql_like_source$']

[[filter.event-filters]]
matcher = ["filter.sql_view_kept"]
ignore-sql = ['^CREATE.*VIEW `filter`\.`sql_view_kept`']

[[filter.event-filters]]
matcher = ["filter.sql_view_replace_ignored"]
ignore-sql = ['^CREATE OR REPLACE VIEW filter\.sql_view_replace_ignored AS SELECT']

[[filter.event-filters]]
matcher = ["filter.sql_view_replace_kept"]
ignore-sql = ['^CREATE OR REPLACE.*VIEW `filter`\.`sql_view_replace_kept`']

# Fast CREATE TABLE can batch concurrent jobs; filter each statement separately.
[[filter.event-filters]]
matcher = ["event_filter.sql_batch_*"]
ignore-sql = ['^CREATE TABLE `?sql_batch_ignored_[0-9]+`? ']
