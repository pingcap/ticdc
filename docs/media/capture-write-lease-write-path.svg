<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#356a8a"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#365f56"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a44a3f"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #24312f; }
    .title { font-size: 26px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #655f55; }
    .type { font-size: 9px; font-weight: 700; letter-spacing: 1.1px; fill: #746b5f; }
    .node-title { font-size: 15px; font-weight: 700; }
    .copy { font-size: 11px; fill: #4f5a57; }
    .edge { font-size: 10px; font-weight: 700; }
    .callout { font-size: 12px; font-weight: 700; }
  </style>
  <rect width="1200" height="860" fill="#f7f2e8"/>

  <text x="48" y="52" text-anchor="start" class="title">Figure 4: Two-stage admission reaches every transport boundary</text>
  <text x="48" y="77" class="subtitle">The outer gate provides backpressure; the transport gate prevents queued work from mutating downstream after expiry</text>
  <rect x="973" y="34" width="179" height="42" rx="7" fill="#fffdf7" stroke="#8c7d68" stroke-dasharray="6 4"/>
  <text x="989" y="51" class="type">WRITE PATH VIEW</text>
  <text x="989" y="68" font-size="11" font-weight="700">FINAL ADMISSION</text>

  <path data-graph-role="edge" d="M 230 165 H 322" fill="none" stroke="#356a8a" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path data-graph-role="edge" d="M 518 165 H 610" fill="none" stroke="#356a8a" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path data-graph-role="edge" d="M 806 165 H 900" fill="none" stroke="#356a8a" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect data-graph-role="node" x="48" y="115" width="182" height="100" rx="8" fill="#fffdf7" stroke="#356a8a" stroke-width="1.7"/>
  <text x="64" y="134" class="type">DISPATCHER</text>
  <text x="64" y="159" class="node-title">Ordered Events</text>
  <text x="64" y="181" class="copy">DML · DDL · checkpoint</text>
  <text x="64" y="198" class="copy">normal and redo paths</text>

  <rect data-graph-role="node" x="322" y="115" width="196" height="100" rx="8" fill="#fef2f2" stroke="#d48c84" stroke-width="1.7"/>
  <text x="338" y="134" class="type">STAGE 1</text>
  <text x="338" y="159" class="node-title">Outer Write Gate</text>
  <text x="338" y="181" class="copy">wait or apply backpressure</text>
  <text x="338" y="198" class="copy">drop superseded checkpoint</text>

  <rect data-graph-role="node" x="610" y="115" width="196" height="100" rx="8" fill="#f5f3ff" stroke="#a78bba" stroke-width="1.7"/>
  <text x="626" y="134" class="type">BUFFERING</text>
  <text x="626" y="159" class="node-title">Batch / Async Queue</text>
  <text x="626" y="181" class="copy">encoding and batching allowed</text>
  <text x="626" y="198" class="copy">no safety decision here</text>

  <rect data-graph-role="node" x="900" y="115" width="252" height="100" rx="8" fill="#ecfdf5" stroke="#86b89d" stroke-width="1.7"/>
  <text x="916" y="134" class="type">STAGE 2</text>
  <text x="916" y="159" class="node-title">Transport Final Gate</text>
  <text x="916" y="181" class="copy">local atomic check immediately</text>
  <text x="916" y="198" class="copy">before downstream side effect</text>

  <text x="275" y="151" text-anchor="middle" class="edge" style="fill:#356a8a">admit</text>
  <text x="565" y="151" text-anchor="middle" class="edge" style="fill:#356a8a">enqueue</text>
  <text x="853" y="151" text-anchor="middle" class="edge" style="fill:#356a8a">dequeue</text>

  <rect data-graph-role="container" x="48" y="265" width="1104" height="430" rx="12" fill="#fffdf7" fill-opacity="0.55" stroke="#8c7d68" stroke-dasharray="8 6"/>
  <text x="68" y="291" class="type">TRANSPORT-OWNED FINAL BOUNDARIES</text>

  <path data-graph-role="edge" d="M 385 385 H 470" fill="none" stroke="#365f56" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path data-graph-role="edge" d="M 385 570 H 470" fill="none" stroke="#365f56" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path data-graph-role="edge" d="M 920 385 H 1005" fill="none" stroke="#365f56" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path data-graph-role="edge" d="M 920 570 H 1005" fill="none" stroke="#365f56" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect data-graph-role="node" x="80" y="330" width="305" height="110" rx="8" fill="#fffdf7" stroke="#4479a1" stroke-width="1.7"/>
  <text x="96" y="350" class="type">MYSQL / TIDB</text>
  <text x="96" y="375" class="node-title">Two-phase DML check</text>
  <text x="96" y="397" class="copy">wait before mutex / sql.Conn</text>
  <text x="96" y="414" class="copy">recheck immediately before SQL</text>
  <rect data-graph-role="node" x="470" y="346" width="155" height="78" rx="8" fill="#eff6ff" stroke="#93b7d0"/>
  <text x="548" y="375" text-anchor="middle" class="node-title">SQL / COMMIT</text>
  <text x="548" y="397" text-anchor="middle" class="copy">DDL and cleanup too</text>

  <rect data-graph-role="node" x="695" y="330" width="225" height="110" rx="8" fill="#fffdf7" stroke="#231f20" stroke-width="1.7"/>
  <text x="711" y="350" class="type">KAFKA / PULSAR</text>
  <text x="711" y="375" class="node-title">Producer boundary</text>
  <text x="711" y="397" class="copy">topic / partition effects</text>
  <text x="711" y="414" class="copy">DML · DDL · checkpoint send</text>
  <rect data-graph-role="node" x="1005" y="346" width="115" height="78" rx="8" fill="#faf5ff" stroke="#a78bba"/>
  <text x="1063" y="375" text-anchor="middle" class="node-title">Broker</text>
  <text x="1063" y="397" text-anchor="middle" class="copy">AsyncSend</text>

  <rect data-graph-role="node" x="80" y="515" width="305" height="110" rx="8" fill="#fffdf7" stroke="#356a8a" stroke-width="1.7"/>
  <text x="96" y="535" class="type">CLOUD STORAGE</text>
  <text x="96" y="560" class="node-title">Publication boundary</text>
  <text x="96" y="582" class="copy">schema · data · index · metadata</text>
  <text x="96" y="599" class="copy">cleanup and delete are gated</text>
  <rect data-graph-role="node" x="470" y="531" width="155" height="78" rx="8" fill="#eff6ff" stroke="#93b7d0"/>
  <text x="548" y="560" text-anchor="middle" class="node-title">Object Store</text>
  <text x="548" y="582" text-anchor="middle" class="copy">publish / delete</text>

  <rect data-graph-role="node" x="695" y="515" width="225" height="110" rx="8" fill="#fffdf7" stroke="#7a5c99" stroke-width="1.7"/>
  <text x="711" y="535" class="type">REDO</text>
  <text x="711" y="560" class="node-title">Persistence boundary</text>
  <text x="711" y="582" class="copy">DML · DDL · rotate / flush</text>
  <text x="711" y="599" class="copy">upload · meta · GC / delete</text>
  <rect data-graph-role="node" x="1005" y="531" width="115" height="78" rx="8" fill="#faf5ff" stroke="#a78bba"/>
  <text x="1063" y="560" text-anchor="middle" class="node-title">Redo Store</text>
  <text x="1063" y="582" text-anchor="middle" class="copy">file / memory</text>

  <path data-graph-role="edge" d="M 1152 165 H 1175 V 736 H 1120" fill="none" stroke="#a44a3f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-red)"/>
  <rect x="760" y="710" width="360" height="58" rx="9" fill="#fef2f2" stroke="#d48c84"/>
  <text x="780" y="735" class="callout" style="fill:#a44a3f">Required proof expires</text>
  <text x="780" y="755" class="copy">queued work remains local; no new side effect starts</text>

  <rect x="48" y="722" width="660" height="76" rx="10" fill="#ecfdf5" stroke="#86b89d"/>
  <text x="68" y="748" class="callout" style="fill:#276749">Performance property</text>
  <text x="68" y="770" class="copy">The final check is an atomic snapshot read and monotonic-clock comparison.</text>
  <text x="68" y="787" class="copy">No coordinator, PD, broker, database, or storage RTT is added per DML.</text>
  <text x="48" y="838" class="subtitle">A transport call admitted before the final check closes may still complete later; leases do not cancel in-flight work.</text>
</svg>
